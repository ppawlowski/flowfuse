version: "2.2"
dependencies:
  - project: ppawlowski/flowfuse
    dependencies:
      - project: ppawlowski/driver-localfs
  - project: ppawlowski/driver-localfs
    dependencies:
      - project: ppawlowski/nr-launcher
  - project: ppawlowski/nr-launcher
build:
  - project: ppawlowski/flowfuse
    build-command:
      before:
      #   current: String | List of Strings
      #   upstream: String | List of Strings
        downstream: npm list -g --depth=0
      current: |
        echo "flowfuse is current"
        npm install --no-audit --no-fund pg-hstore@^2.3.4
        npm install --no-audit --no-fund @flowfuse/driver-kubernetes
        npm install --no-audit --no-fund
        npm run build
      upstream: | 
        echo "flowfuse is Upstream"
      downstream: |
        echo "flowfuse is downstream"
        npm install --no-audit --no-fund pg-hstore@^2.3.4
        npm install --no-audit --no-fund @flowfuse/driver-kubernetes
        npm install --no-audit --no-fund
        npm install --no-audit --no-fund ../ppawlowski_driver-localfs/flowfuse-driver-localfs.tgz
        npm run build
        docker build -f ./ci/Dockerfile-build-chain -t k8s-forge:build-chain-local .
      # after:
      #   current: |
      #     pwd
      #     cat package.json
      #   upstream: |
      #     npm list -g --depth=0
      #   downstream: String | List of Strings
    # clone: List of Strings
    # skip: true
  - project: ppawlowski/nr-launcher
    build-command:
      upstream: echo "nr-launcher is Upstream"
      current: npm ci 
      downstream: npm ci 
      # upstream:
      #   npm ci
      #   npm run test
      #   npm link
  - project: ppawlowski/driver-localfs
    build-command:
      current: |
        npm ci
        npm pack --no-scripts
        mv flowfuse-driver-localfs-*.tgz flowfuse-driver-localfs.tgz
      upstream: echo "driver-localfs is Upstream"
      downstream: echo "driver-localfs is Downstream"
      after:
        current: |
          pwd
          cat package.json
      #   upstream: String | List of Strings
      #   downstream: String | List of Strings
    # clone: List of Strings
    # skip: true